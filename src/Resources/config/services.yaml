services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # 1.7 (rule 6): the manager of the bundle entities (doctrine.entity_manager, else the one that maps them),
            # never the host's default manager by accident.
            Doctrine\ORM\EntityManagerInterface $entityManager: '@nowo_contact_form.entity_manager'

    Nowo\ContactFormBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Form/'
            - '../../NowoContactFormBundle.php'
            - '../../Client/ClientReference.php'
            - '../../Exception/'
            - '../../Notification/MailerContactSubmissionNotifier.php'
            - '../../Service/ContactFormSubmissionRateLimiter.php'
            - '../../Security/'
            - '../../EventSubscriber/ContactFormAdminAccessSubscriber.php'
            - '../../Controller/'

    # REQ-SF-004 rule 7: the controllers carry #[Route] and must not be autoconfigured. On Symfony >= 7.3
    # autoconfiguration tags them `routing.controller`, and the host's `controllers: { resource: routing.controllers }`
    # would then register the contact form routes without the host importing routes.yaml (opt-in only, with
    # web_ui.path_prefix). Tagged explicitly instead; they extend AbstractController, hence the service subscriber tag.
    Nowo\ContactFormBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']
        public: true

    Nowo\ContactFormBundle\Service\ContactPhonePrefixResolver:
        arguments:
            $defaultPrefixes: '%nowo_contact_form.phone_prefixes%'

    Nowo\ContactFormBundle\Service\DynamicContactFormBuilder:
        arguments:
            $fileMaxSize: '%nowo_contact_form.file_upload.max_size%'
            $fileMimeTypes: '%nowo_contact_form.file_upload.mime_types%'
            $textMaxLength: '%nowo_contact_form.public_field_max_length.text%'
            $textareaMaxLength: '%nowo_contact_form.public_field_max_length.textarea%'

    Nowo\ContactFormBundle\Service\ContactPhoneInputOptionsResolver:
        arguments:
            $bundleDefaults: '%nowo_contact_form.phone_input%'

    Nowo\ContactFormBundle\Notification\NullContactSubmissionNotifier: ~
    Nowo\ContactFormBundle\Service\NullContactFormFileUploadHandler: ~

    Nowo\ContactFormBundle\Service\IpAnonymizer: ~
    Nowo\ContactFormBundle\Service\ClientLabelResolver: ~
    Nowo\ContactFormBundle\Service\SecurityClientResolver: ~

    Nowo\ContactFormBundle\Service\ContactFormEntityManagerResolver:
        arguments:
            $managerName: '%nowo_contact_form.doctrine.entity_manager%'

    # 1.7 (LI-CF-L2): exact-match collation of client_reference on MySQL / MariaDB (#[AsDoctrineListener]).
    Nowo\ContactFormBundle\Doctrine\ClientReferenceCollationListener:
        arguments:
            $platform: null

    nowo_contact_form.entity_manager:
        class: Doctrine\ORM\EntityManagerInterface
        factory: ['@Nowo\ContactFormBundle\Service\ContactFormEntityManagerResolver', 'get']

    Nowo\ContactFormBundle\Service\ContactSubmissionRecorderInterface:
        alias: Nowo\ContactFormBundle\Service\ContactSubmissionProcessor

    Nowo\ContactFormBundle\Service\ContactSubmissionProcessor:
        arguments:
            $valueNormalizer: '@Nowo\ContactFormBundle\Service\ContactFormSubmissionValueNormalizer'
            $clock: '@clock'
            $defaultNotificationRecipient: '%nowo_contact_form.notifications.default_recipient%'

    Nowo\ContactFormBundle\Notification\ContactSubmissionNotifierInterface:
        alias: Nowo\ContactFormBundle\Notification\NullContactSubmissionNotifier

    Nowo\ContactFormBundle\Service\ContactFormFileUploadHandlerInterface:
        alias: Nowo\ContactFormBundle\Service\NullContactFormFileUploadHandler

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\ContactFormBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
