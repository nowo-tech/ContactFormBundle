nowo_contact_form:
    client_entity_class: null
    client_label_property: email
    client_user_accessor: null
    ip_anonymization_salt: '%kernel.secret%'
    default_retention_days: 365
    # Layouts, CSS stack and row actions come from nowo_ui_kit (layouts.admin / layouts.guest, css_framework), REQ-UI-003.
    web_ui:
        enabled: true
        path_prefix: '/admin/contact-forms'
        layout_template: null          # null = nowo_ui_kit.layouts.admin
        public_layout_template: null   # null = nowo_ui_kit.layouts.guest
        list_page_size: 20
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    notifications:
        enabled: false
        service: null
        default_recipient: null
        mailer:
            enabled: false
            from: 'noreply@example.com'
            subject: 'New contact submission: {form}'
    file_upload:
        service: null
        max_size: 5M
        # mime_types: [application/pdf, image/jpeg, image/png]  # default: PDF, text, Word/ODT, JPEG/PNG/GIF/WebP; [] = any
    public_submission_rate_limit:
        enabled: true
        limit: 5
        interval_seconds: 60
