nowo_contact_form:
    client_entity_class: null
    client_label_property: email
    client_user_accessor: null
    ip_anonymization_salt: '%kernel.secret%'
    default_retention_days: 365
    admin_route_prefix: '/admin/contact-forms'
    web_ui:
        enabled: true
        layout_template: '@NowoContactFormBundle/admin/layout.html.twig'
        css_framework: bootstrap5
        icon_set: bootstrap-icons
        list_page_size: 20
    security:
        access_roles: [ROLE_ADMIN]
        allow_unauthenticated: false
    notifications:
        enabled: false
        service: null
        default_recipient: null
        mailer:
            enabled: false
            from: 'noreply@example.com'
            subject: 'New contact submission: {form}'
    file_upload:
        service: null
    public_submission_rate_limit:
        enabled: true
        limit: 5
        interval_seconds: 60
