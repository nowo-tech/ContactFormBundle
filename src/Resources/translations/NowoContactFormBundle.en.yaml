        phone_default_country_invalid: Default country must be a two-letter ISO code (e.g. ES).
        phone_allowed_countries: Allowed countries (one ISO per line)
        phone_allowed_countries_help: 'For Phone Input Bundle widget. Optional whitelist (e.g. ES, US). Leave empty for all bundled countries.'
        phone_allowed_countries_invalid: Each country must be a two-letter ISO code (e.g. ES).
        phone_allowed_countries_duplicate: Allowed countries must be unique.
