# CI: tests on PHP 8.2–8.5 × Symfony 7.4, 8.0, 8.1 (exclusions for incompatible pairs).
# Coverage with PCOV; release updated via release.yml on tag push.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        symfony: ['7.4', '8.0', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.0'
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.0'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          # doctrine-bundle 2.x lacks Symfony 8; SF8 support landed in 3.1+.
          DOCTRINE_BUNDLE='^2.13 || ^3.0'
          case "${{ matrix.symfony }}" in
            8.*) DOCTRINE_BUNDLE='^3.1' ;;
          esac

          composer require --no-interaction --no-update \
            "symfony/config:^${{ matrix.symfony }}" \
            "symfony/console:^${{ matrix.symfony }}" \
            "symfony/dependency-injection:^${{ matrix.symfony }}" \
            "symfony/event-dispatcher:^${{ matrix.symfony }}" \
            "symfony/form:^${{ matrix.symfony }}" \
            "symfony/framework-bundle:^${{ matrix.symfony }}" \
            "symfony/http-foundation:^${{ matrix.symfony }}" \
            "symfony/http-kernel:^${{ matrix.symfony }}" \
            "symfony/routing:^${{ matrix.symfony }}" \
            "symfony/translation:^${{ matrix.symfony }}" \
            "symfony/twig-bundle:^${{ matrix.symfony }}" \
            "symfony/validator:^${{ matrix.symfony }}" \
            "doctrine/doctrine-bundle:${DOCTRINE_BUNDLE}" \
            "doctrine/orm:^3.0"

          composer require --dev --no-interaction --no-update \
            "symfony/browser-kit:^${{ matrix.symfony }}" \
            "symfony/dom-crawler:^${{ matrix.symfony }}" \
            "symfony/mailer:^${{ matrix.symfony }}" \
            "symfony/security-bundle:^${{ matrix.symfony }}" \
            "symfony/security-core:^${{ matrix.symfony }}" \
            "symfony/security-csrf:^${{ matrix.symfony }}" \
            "symfony/var-exporter:^${{ matrix.symfony }}" \
            "symfony/web-profiler-bundle:^${{ matrix.symfony }}" \
            "symfony/yaml:^${{ matrix.symfony }}"

          # Update Symfony + Doctrine so locked doctrine-bundle 2.x can move to 3.x on SF8.
          composer update "symfony/*" "doctrine/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "🧪 Running tests on PHP ${{ matrix.php }} with Symfony ${{ matrix.symfony }}..."
          composer test
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Some tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Run tests with coverage (PHP 8.2 + Symfony 7.4 only)
        if: matrix.php == '8.2' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: |
          echo "📊 Generating coverage report..."
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed when generating coverage"
            exit 1
          fi
          echo "✅ Coverage generated"

  code-style:
    name: Code Style
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Fix code style
        run: composer cs-fix

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Apply PHP CS Fixer fixes [skip ci]"
          git push

  code-style-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, cs2pr

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies (Symfony 7.4)
        run: |
          composer require --no-interaction --no-update \
            "symfony/config:^7.4" \
            "symfony/console:^7.4" \
            "symfony/dependency-injection:^7.4" \
            "symfony/event-dispatcher:^7.4" \
            "symfony/form:^7.4" \
            "symfony/framework-bundle:^7.4" \
            "symfony/http-foundation:^7.4" \
            "symfony/http-kernel:^7.4" \
            "symfony/routing:^7.4" \
            "symfony/translation:^7.4" \
            "symfony/twig-bundle:^7.4" \
            "symfony/validator:^7.4"
          composer require --dev --no-interaction --no-update \
            "symfony/browser-kit:^7.4" \
            "symfony/dom-crawler:^7.4" \
            "symfony/mailer:^7.4" \
            "symfony/security-bundle:^7.4" \
            "symfony/security-core:^7.4" \
            "symfony/security-csrf:^7.4" \
            "symfony/var-exporter:^7.4" \
            "symfony/web-profiler-bundle:^7.4" \
            "symfony/yaml:^7.4"
          composer update "symfony/*" "doctrine/*" --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Run tests with coverage
        run: |
          echo "🧪 Running tests with coverage..."
          rm -rf .phpunit.cache
          composer test-coverage
          if [ $? -ne 0 ]; then
            echo "❌ ERROR: Tests failed"
            exit 1
          fi
          echo "✅ All tests passed successfully"

      - name: Validate coverage file
        run: |
          if [ ! -f coverage.xml ]; then
            echo "ERROR: coverage.xml was not generated"
            exit 1
          fi
          echo "✅ coverage.xml generated"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
