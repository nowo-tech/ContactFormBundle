name: contact-form-demo-symfony8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contact-form-demo-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8021}:80"
    volumes:
      - .:/app
      - ../..:/var/contact-form-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      # Demo always runs in dev (Web Profiler, Twig Inspector, debug toolbar)
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - contact-form-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  contact-form-demo-network:
    driver: bridge
