# UiKit page contract (REQ-UI-003) and REQ-DEMO-014: UiKit's default theme, unchanged (no theme tokens, no CSS
# framework, no CDN); the demo shell serves as the admin and guest layout of every bundle page.
nowo_ui_kit:
    css_framework: custom
    row_actions_display: icon_text
    layouts:
        admin: 'layouts/admin.html.twig'
        guest: 'layouts/guest.html.twig'
