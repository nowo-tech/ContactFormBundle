name: contact-form-bundle

services:
  php:
    build: .
    volumes:
      - .:/app
      - coverage-data:/app/coverage
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
      # REQ-RUNTIME-003: real-database concurrency tests (make test-with-db starts the "databases" profile).
      CF_MYSQL_URL: mysql://root@mysql:3306/contact_form?serverVersion=8.4.0&charset=utf8mb4
      CF_MARIADB_URL: mysql://root@mariadb:3306/contact_form?serverVersion=11.4.0-MariaDB&charset=utf8mb4
      CF_POSTGRES_URL: pgsql://postgres@postgres:5432/contact_form?serverVersion=16

  mysql:
    image: mysql:8.4
    profiles: [databases]
    environment: { MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: contact_form }
    healthcheck: { test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1'], interval: 5s, retries: 30 }

  mariadb:
    image: mariadb:11.4
    profiles: [databases]
    environment: { MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes', MARIADB_DATABASE: contact_form }
    healthcheck: { test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized'], interval: 5s, retries: 30 }

  postgres:
    image: postgres:16-alpine
    profiles: [databases]
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: contact_form }
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'postgres'], interval: 5s, retries: 30 }

volumes:
  coverage-data:
